<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mirimiri shop | 枯れないお花の編み物ギフト</title>
  <style>
    :root {
      --primary-color: #e8a598;
      --bg-color: #faf6f0;
      --card-bg: #ffffff;
      --text-color: #5a4a42;
      --sub-text: #8c7b70;
      --line-color: #00c300;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    /* ヘッダー */
    header {
      text-align: center;
      padding: 30px 20px 20px;
      border-bottom: 2px dashed #e8c4bc;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary-color);
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--sub-text);
    }

    /* メインコンテンツ */
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    /* メインビジュアル */
    .hero-banner {
      background-color: #f5e8dd;
      border-radius: 20px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--sub-text);
      font-size: 1.1rem;
      margin-bottom: 25px;
      background-size: cover;
      background-position: center;
    }

    /* キャッチコピー */
    .hero-text {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero-text h2 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--text-color);
    }

    .hero-text p {
      font-size: 0.85rem;
      color: var(--sub-text);
    }

    /* セクションタイトル */
    .section-title {
      text-align: center;
      font-size: 1.1rem;
      color: var(--primary-color);
      margin-bottom: 20px;
      font-weight: bold;
    }

    /* 横型商品カードリスト */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 40px;
    }

    .product-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .product-image {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      object-fit: cover;
      background-color: #f5e8dd;
      flex-shrink: 0;
    }

    .product-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .product-title {
      font-size: 1rem;
      font-weight: bold;
    }

    .product-price {
      font-size: 0.95rem;
      color: var(--primary-color);
      font-weight: bold;
    }

    .buy-button {
      display: inline-block;
      margin-top: 5px;
      padding: 8px 16px;
      background-color: var(--primary-color);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 20px;
      text-align: center;
      width: fit-content;
    }

    /* 公式つながりセクション */
    .social-section {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .social-box {
      border: 1.5px dashed #f0cbb8;
      background-color: #fff9f5;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--sub-text);
      margin-bottom: 15px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 25px;
      margin-bottom: 10px;
    }

    .line-btn { background-color: var(--line-color); }
    .insta-btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

    #loading { text-align: center; padding: 20px; color: var(--sub-text); }
  </style>
</head>
<body>

  <header>
    <h1>mirimiri shop</h1>
    <p>〜 ほっこり笑顔を届ける編み物フラワー 〜</p>
  </header>

  <div class="container">
    <!-- メインビジュアル -->
    <div class="hero-banner">🌸 [ここにイチオシ作品の写真]</div>

    <!-- キャッチコピー -->
    <div class="hero-text">
      <h2>ずっとキレイな、手のひらのお花</h2>
      <p>ひとつひとつ心を込めて編み上げた<br>世界にひとつだけのハンドメイド作品をお届けします。</p>
    </div>

    <!-- 商品一覧（microCMSから動的読み込み） -->
    <div class="section-title">✨ 人気の作品</div>
    <div id="loading">商品を読み込んでいます...</div>
    <div id="product-list" class="product-list"></div>

    <!-- 公式つながり -->
    <div class="social-section">
      <div class="section-title" style="margin-bottom: 10px;">🌱 mirimiri公式つながり</div>
      <div class="social-box">
        🎁 <strong>公式LINE登録でポイントゲット！</strong><br>
        ショップカードでポイントを貯めて限定ノベルティをプレゼント中♪
      </div>
      <a href="#" class="social-btn line-btn">💬 LINEでポイントカードを受け取る</a>
      <a href="#" class="social-btn insta-btn">📸 Instagramで新作チェック</a>
    </div>
  </div>

  <script>
    const SERVICE_DOMAIN = 'mirimiri-shop';
    const API_KEY = 'YOUR_API_KEY'; // ★ご自身のmicroCMS APIキーに書き換えてください

    async function fetchProducts() {
      const loadingEl = document.getElementById('loading');
      const containerEl = document.getElementById('product-list');

      try {
        const response = await fetch(`https://${SERVICE_DOMAIN}.microcms.io/api/v1/products`, {
          headers: { 'X-MICROCMS-API-KEY': API_KEY }
        });

        if (!response.ok) throw new Error('データ取得失敗');

        const data = await response.json();
        loadingEl.style.display = 'none';

        data.contents.forEach(product => {
          const card = document.createElement('div');
          card.className = 'product-card';

          const imageUrl = product.image ? product.image.url : '';
          const squareUrl = product.square_url || '#';
          
          // 価格のエラー防止処理
          const priceNum = Number(product.price);
          const formattedPrice = isNaN(priceNum) ? product.price : priceNum.toLocaleString();

          card.innerHTML = `
            <img class="product-image" src="${imageUrl}" alt="${product.name}">
            <div class="product-info">
              <div class="product-title">${product.name}</div>
              <div class="product-price">¥${formattedPrice} <span style="font-size: 0.75rem; color: #8c7b70; font-weight: normal;">(税込)</span></div>
              <a href="${squareUrl}" class="buy-button" target="_blank" rel="noopener noreferrer">Squareで購入</a>
            </div>
          `;

          containerEl.appendChild(card);
        });

      } catch (error) {
        console.error('Error:', error);
        loadingEl.innerText = '商品の読み込みに失敗しました。';
      }
    }

    fetchProducts();
  </script>
</body>
</html>
